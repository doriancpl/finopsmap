<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1520"/>
      <stop offset="40%" stop-color="#0d111a"/>
      <stop offset="60%" stop-color="#0d111a"/>
      <stop offset="100%" stop-color="#0a1520"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7bffe0"/>
      <stop offset="100%" stop-color="#00aaff"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.8" fill="#7bffe0" opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>

  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1e3050" stroke-width="0.5" opacity="0.3"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1e3050" stroke-width="0.5" opacity="0.3"/>

  <!-- Logo icon (scaled from 32x32 to 80x80) -->
  <g transform="translate(560, 150) scale(2.5)">
    <rect width="32" height="32" rx="6" fill="#060709"/>
    <circle cx="16" cy="16" r="11" fill="none" stroke="#3a4468" stroke-width="1.2"/>
    <line x1="16" y1="6" x2="16" y2="26" stroke="#3a4468" stroke-width="0.8"/>
    <line x1="6" y1="16" x2="26" y2="16" stroke="#3a4468" stroke-width="0.8"/>
    <polygon points="16,6 13,14 16,12 19,14" fill="#ff9900"/>
    <polygon points="16,26 13,18 16,20 19,18" fill="#2a3050"/>
    <polygon points="26,16 18,13 20,16 18,19" fill="#00aaff"/>
    <polygon points="6,16 14,13 12,16 14,19" fill="#2a3050"/>
    <circle cx="16" cy="16" r="2.5" fill="#7bffe0"/>
    <circle cx="16" cy="16" r="1" fill="#060709"/>
  </g>

  <!-- Logo text -->
  <text x="600" y="310" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="56" font-weight="800" letter-spacing="-2">
    <tspan fill="#c8d0e8">FinOps</tspan><tspan fill="#7bffe0">Map</tspan>
  </text>

  <!-- Tagline -->
  <text x="600" y="355" text-anchor="middle" font-family="monospace" font-size="16" fill="#6b738f" letter-spacing="2">
    AWS &amp; AZURE CLOUD PRICING COMPARATOR
  </text>

  <!-- Features line -->
  <text x="600" y="420" text-anchor="middle" font-family="monospace" font-size="13" fill="#3a4468" letter-spacing="1">
    COMPARE  ·  ANALYZE  ·  OPTIMIZE
  </text>

  <!-- Free & Open Source chip -->
  <rect x="505" y="455" width="190" height="26" rx="13" fill="rgba(123,255,224,0.06)" stroke="#7bffe0" stroke-width="0.8" opacity="0.5"/>
  <text x="600" y="473" text-anchor="middle" font-family="monospace" font-size="10" fill="#7bffe0" opacity="0.6" letter-spacing="2">
    FREE &amp; OPEN SOURCE
  </text>

  <!-- URL -->
  <text x="600" y="540" text-anchor="middle" font-family="monospace" font-size="14" fill="#7bffe0" opacity="0.6" letter-spacing="3">
    FINOPSMAP.COM
  </text>

  <!-- Bottom border accent -->
  <rect x="0" y="625" width="1200" height="5" fill="url(#accent)" opacity="0.4"/>
</svg>
