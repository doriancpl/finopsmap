name: Update Prices

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6am UTC
  workflow_dispatch:       # Manual trigger from GitHub UI

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch_prices.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python3 fetch_prices.py

      - name: Commit and push index.html
        run: |
          git config user.name "FinOpsMap"
          git config user.email "finopsmap@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "chore: update prices $(date +'%Y-%m-%d')"
          git push
